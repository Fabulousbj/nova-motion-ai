<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Motion AI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #121a30;
            border-bottom: 1px solid #273454;
        }

        h1 {
            color: #67e8f9;
        }

        main {
            max-width: 650px;
            margin: 50px auto;
            padding: 25px;
        }

        textarea {
            width: 95%;
            height: 120px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #354568;
            background: #111a30;
            color: white;
        }

        button {
            margin-top: 18px;
            padding: 14px 24px;
            background: #06b6d4;
            color: #07111f;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <header>
        <h1>Nova Motion AI</h1>
        <p>Bring your imagination to life.</p>
    </header>

    <main>
        <h2>AI Video Generator</h2>
        <p>Describe the video you want to create.</p>

        <textarea placeholder="Example: A futuristic city at sunset, cinematic lighting..."></textarea>
        <br>

        <button onclick="alert('Video generation will be connected after API setup.')">
            Generate Video
        </button>

        <p>Text-to-video and image-to-video creation.</p>
    </main>

    <footer>
        <p>Nova Motion AI &copy; 2026</p>
    </footer>
</body>
</html>
